name: Sync upstream and notify

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Send a notification even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync main with upstream
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FORCE: ${{ inputs.force_notify }}
        run: |
          if [ "$EVENT" = "push" ]; then
            OLD="$BEFORE"
            NEW="$AFTER"
          else
            OLD=$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)
            gh api repos/$GITHUB_REPOSITORY/merge-upstream -f branch=main > /dev/null
            NEW=$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)
            if [ "$FORCE" = "true" ] && [ "$OLD" = "$NEW" ]; then
              OLD=$(gh api repos/$GITHUB_REPOSITORY/commits/$NEW --jq '.parents[0].sha')
            fi
          fi
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: steps.sync.outputs.old != steps.sync.outputs.new
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          OLD: ${{ steps.sync.outputs.old }}
          NEW: ${{ steps.sync.outputs.new }}
          STRINGS_PATH: ${{ vars.STRINGS_PATH }}
        run: python3 notify.py
